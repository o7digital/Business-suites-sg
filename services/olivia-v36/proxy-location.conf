    # Public hotel widget gateway only; the private Olivia API remains separate.
    location ^~ /business-suites-sg/ {
        if ($scheme != https) { return 403; }
        client_max_body_size 16k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $business_sg_olivia http://business-suites-sg-olivia36:8093;
        rewrite ^/business-suites-sg/(.*)$ /$1 break;
        proxy_pass $business_sg_olivia;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_read_timeout 65s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
